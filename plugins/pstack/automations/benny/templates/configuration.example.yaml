schema_version: 1

automations:
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"

slack:
  source_channel_id: "SOURCE_CHANNEL_ID"
  source_team_id: "SOURCE_TEAM_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  # spawned sessions read and post through devin's slack tools, scoped to the
  # channels listed in each automation's tools.slack_channels allowlist.
  optional_bot_token_secret: "BENNY_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_subagent_slack_writes: false

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  draft_only: true
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"

tracker:
  type: "linear"
  # how spawned sessions reach the tracker: devin's linear integration
  # (tools.linear_enabled) or a tracker mcp server in tools.mcp_servers.
  access: "linear-integration"
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "Slack report"
  require_compensation_action: true

routing:
  map_path: ".devin/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".devin/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/benny-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

sessions:
  # devin_mode per spawned session: normal, fast, lite, ultra, or fusion.
  # per-model subagent profiles do not load in cloud sessions, so these are
  # modes, not model slugs.
  triage: "normal"
  reproduce: "normal"
  code: "normal"
  media_review: "normal"
